name: Build Minecraft Bedrock Server Host APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Auto-Generate Project and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Scaffolding
        run: flutter create --project-name mc_bedrock_host --org com.mcserver .

      - name: Overwrite pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: mc_bedrock_host
          description: "Minecraft Bedrock Server Host for Android"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            flutter_foreground_task: ^6.5.0
            process_run: ^0.14.0
            path_provider: ^2.1.1
            http: ^1.1.0
            archive: ^3.4.10
            permission_handler: ^11.0.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Overwrite Application Code (main.dart)
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:io';
          import 'dart:isolate';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_foreground_task/flutter_foreground_task.dart';
          import 'package:process_run/shell.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:http/http.dart' as http;
          import 'package:archive/archive.dart';
          import 'package:permission_handler/permission_handler.dart';

          // ==========================================
          // BACKGROUND TASK HANDLER (Server Zinda Rakhne Ke Liye)
          // ==========================================
          @pragma('vm:entry-point')
          void startCallback() {
            FlutterForegroundTask.setTaskHandler(ServerTaskHandler());
          }

          class ServerTaskHandler extends TaskHandler {
            Process? _serverProcess;
            final List<String> _logs = [];
            final SendPort? _sendPort = FlutterForegroundTask.sendPort;

            @override
            Future<void> onStart(DateTime timestamp, dynamic starter) async {
              _sendPort?.send('SERVER_READY');
            }

            @override
            void onRepeatEvent(DateTime timestamp, SendPort? sendPort) {
              // Server ko zinda rakhne ke liye heartbeat
              sendPort?.send('PING:${DateTime.now().millisecondsSinceEpoch}');
            }

            @override
            Future<void> onDestroy(DateTime timestamp, SendPort? sendPort) async {
              _serverProcess?.kill();
              sendPort?.send('SERVER_STOPPED');
            }

            // Yeh function asli server start karega
            Future<void> startBedrockServer(String serverDir, SendPort? uiSendPort) async {
              try {
                // 1. Proot environment set karna (Ubuntu/Debian)
                // Yeh command asli mein proot-distro ke through chalti hai
                // Yahan hum simulate kar rahe hain ki hum proot ke andar hain
                
                final prootCommand = '''
                cd $serverDir && 
                export LD_LIBRARY_PATH=$serverDir && 
                ./bedrock_server
                ''';

                uiSendPort?.send('LOG:Starting Bedrock Server from $serverDir...');
                
                // Note: Asli implementation mein yahan proot-distro login ke through
                // command execute hogi. Yeh code structure dikhata hai ki kya karna hai.
                _serverProcess = await Process.start(
                  'proot',
                  ['-0', '-r', 'ubuntu', '-b', '/dev', '-b', '/sys', '-b', '/proc', 
                   '-w', serverDir, '/bin/bash', '-c', './bedrock_server'],
                  environment: {'LD_LIBRARY_PATH': serverDir},
                );

                _serverProcess!.stdout.transform(SystemEncoding().decoder).listen((data) {
                  uiSendPort?.send('LOG:$data');
                });

                _serverProcess!.stderr.transform(SystemEncoding().decoder).listen((data) {
                  uiSendPort?.send('LOG:ERROR: $data');
                });

                uiSendPort?.send('LOG:Server process started with PID: ${_serverProcess!.pid}');

              } catch (e) {
                uiSendPort?.send('LOG:ERROR: Failed to start server: $e');
              }
            }

            @override
            void onReceiveData(Object data) {
              if (data is Map && data.containsKey('action')) {
                if (data['action'] == 'START_SERVER') {
                  final String dir = data['serverDir'];
                  final SendPort? replyPort = data['replyPort'];
                  startBedrockServer(dir, replyPort);
                } else if (data['action'] == 'STOP_SERVER') {
                  _serverProcess?.kill();
                  _sendPort?.send('LOG:Server stopped by user.');
                }
              }
            }
          }

          // ==========================================
          // MAIN APP
          // ==========================================
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            
            FlutterForegroundTask.init(
              androidNotificationOptions: AndroidNotificationOptions(
                channelId: 'mc_server_channel',
                channelName: 'Minecraft Server',
                channelDescription: 'Keeps the Minecraft Bedrock server running.',
                channelImportance: NotificationChannelImportance.LOW,
                priority: NotificationPriority.LOW,
                enableVibration: false,
              ),
              iosNotificationOptions: const IOSNotificationOptions(),
              foregroundTaskOptions: const ForegroundTaskOptions(
                autoRunOnBoot: false,
                allowWakeLock: true,
                allowWifiLock: true,
              ),
            );
            
            SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const MinecraftHostApp());
          }

          class MinecraftHostApp extends StatelessWidget {
            const MinecraftHostApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'MC Bedrock Host',
                debugShowCheckedModeBanner: false,
                themeMode: ThemeMode.dark,
                darkTheme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF10B981),
                    secondary: Color(0xFF8B5CF6),
                    surface: Color(0xFF1E293B),
                  ),
                  useMaterial3: true,
                ),
                home: const DashboardScreen(),
              );
            }
          }

          enum ServerState { stopped, downloading, starting, running, stopping }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            ServerState _serverState = ServerState.stopped;
            String _ipAddress = "Offline";
            int _port = 19132;
            String _serverName = "My Bedrock Server";
            int _connectedPlayers = 0;
            final int _maxPlayers = 3;
            String _serverDir = "";

            final List<String> _logs = [
              "[INFO] MC Host System Ready.",
              "[INFO] Target: Minecraft Bedrock Dedicated Server",
            ];

            final ScrollController _logScrollController = ScrollController();
            ReceivePort? _receivePort;
            SendPort? _sendPort;

            @override
            void initState() {
              super.initState();
              _initForegroundCommunication();
            }

            void _initForegroundCommunication() {
              _receivePort = ReceivePort();
              _receivePort!.listen((data) {
                if (data is String) {
                  if (data.startsWith('LOG:')) {
                    _addLog(data.substring(4));
                  } else if (data == 'SERVER_READY') {
                    _addLog("[INFO] Background service connected.");
                  }
                }
              });
              _sendPort = _receivePort!.sendPort;
            }

            void _addLog(String message) {
              setState(() {
                _logs.add("[${DateTime.now().toString().split('.').first.split(' ').last}] $message");
              });
              Future.delayed(const Duration(milliseconds: 100), () {
                if (_logScrollController.hasClients) {
                  _logScrollController.animateTo(
                    _logScrollController.position.maxScrollExtent,
                    duration: const Duration(milliseconds: 200),
                    curve: Curves.easeOut,
                  );
                }
              });
            }

            // ==========================================
            // ASLI SERVER START KARNE KA LOGIC
            // ==========================================
            Future<void> _startServer() async {
              // 1. Storage Permission
              var status = await Permission.storage.request();
              if (!status.isGranted) {
                _addLog("[ERROR] Storage permission denied!");
                return;
              }

              setState(() => _serverState = ServerState.downloading);
              _addLog("[INFO] Downloading Bedrock Server...");

              try {
                // 2. Server Directory Setup
                final appDir = await getApplicationDocumentsDirectory();
                _serverDir = '${appDir.path}/bedrock_server';
                final serverDirObj = Directory(_serverDir);
                if (!await serverDirObj.exists()) {
                  await serverDirObj.create(recursive: true);
                }

                // 3. Bedrock Server Download (x86_64 Linux)
                // Note: Asli mein yahan server download aur extract hota hai.
                // Hum yahan sirf structure dikha rahe hain.
                const serverUrl = 'https://minecraft.net/en-us/download/server/bedrock/';
                // final response = await http.get(Uri.parse(serverUrl));
                // final bytes = response.bodyBytes;
                // final archive = ZipDecoder().decodeBytes(bytes);
                // for (final file in archive) {
                //   final filename = file.name;
                //   if (file.isFile) {
                //     final data = file.content as List<int>;
                //     File('$_serverDir/$filename').writeAsBytesSync(data);
                //   }
                // }

                _addLog("[INFO] Server files ready at: $_serverDir");

                // 4. Permissions set karna (executable banana)
                await shell.run('chmod +x $_serverDir/bedrock_server');
                _addLog("[INFO] Executable permission set.");

                // 5. Server Start Karna (Background Service Ke Through)
                setState(() => _serverState = ServerState.starting);
                
                await FlutterForegroundTask.startService(
                  notificationTitle: 'Bedrock Server Starting...',
                  notificationText: 'Please wait...',
                  callback: startCallback,
                );

                // 6. Background service ko command bhejna
                await Future.delayed(const Duration(seconds: 2));
                FlutterForegroundTask.sendDataToTask({
                  'action': 'START_SERVER',
                  'serverDir': _serverDir,
                  'replyPort': _sendPort,
                });

                // 7. IP aur Port set karna
                // Asli IP ke liye playit.gg ka use karna padega.
                // Yahan hum placeholder daal rahe hain.
                setState(() {
                  _serverState = ServerState.running;
                  _ipAddress = "connect.playit.gg"; // Playit.gg se aayega
                  _port = 19132;
                });

                _addLog("[INFO] Server started! IP: $_ipAddress Port: $_port");

              } catch (e) {
                _addLog("[ERROR] Failed to start server: $e");
                setState(() => _serverState = ServerState.stopped);
              }
            }

            Future<void> _stopServer() async {
              setState(() => _serverState = ServerState.stopping);
              _addLog("[INFO] Stopping server...");
              
              FlutterForegroundTask.sendDataToTask({'action': 'STOP_SERVER'});
              await Future.delayed(const Duration(seconds: 2));
              await FlutterForegroundTask.stopService();

              setState(() {
                _serverState = ServerState.stopped;
                _ipAddress = "Offline";
              });
              _addLog("[INFO] Server stopped.");
            }

            @override
            void dispose() {
              _receivePort?.close();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  elevation: 0,
                  title: const Row(
                    children: [
                      Icon(Icons.sports_esports, color: Color(0xFF10B981)),
                      SizedBox(width: 10),
                      Text("MC Bedrock Host", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                    ],
                  ),
                ),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(16.0),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        _buildStatusCard(),
                        const SizedBox(height: 16),
                        _buildConnectionDetailsCard(),
                        const SizedBox(height: 16),
                        Expanded(child: _buildConsoleLogs()),
                        const SizedBox(height: 16),
                        _buildActionButton(),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _buildStatusCard() {
              Color statusColor;
              String statusText;

              switch (_serverState) {
                case ServerState.stopped:
                  statusColor = Colors.redAccent;
                  statusText = "SERVER OFFLINE";
                  break;
                case ServerState.downloading:
                  statusColor = Colors.blue;
                  statusText = "DOWNLOADING...";
                  break;
                case ServerState.starting:
                  statusColor = Colors.orangeAccent;
                  statusText = "STARTING UP...";
                  break;
                case ServerState.running:
                  statusColor = const Color(0xFF10B981);
                  statusText = "ONLINE & READY";
                  break;
                case ServerState.stopping:
                  statusColor = Colors.orangeAccent;
                  statusText = "STOPPING...";
                  break;
              }

              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(
                  color: const Color(0xFF1E293B),
                  borderRadius: BorderRadius.circular(16),
                  border: Border.all(color: statusColor.withOpacity(0.4), width: 1.5),
                ),
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(_serverName, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 4),
                        Text("Minecraft Bedrock v1.26+", style: TextStyle(color: Colors.grey.shade400, fontSize: 13)),
                      ],
                    ),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                      decoration: BoxDecoration(
                        color: statusColor.withOpacity(0.15),
                        borderRadius: BorderRadius.circular(20),
                        border: Border.all(color: statusColor),
                      ),
                      child: Row(
                        children: [
                          CircleAvatar(radius: 4, backgroundColor: statusColor),
                          const SizedBox(width: 8),
                          Text(statusText, style: TextStyle(color: statusColor, fontWeight: FontWeight.bold, fontSize: 12)),
                        ],
                      ),
                    )
                  ],
                ),
              );
            }

            Widget _buildConnectionDetailsCard() {
              final bool isOnline = _serverState == ServerState.running;
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(16)),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text("Minecraft Server Address", style: TextStyle(fontSize: 14, color: Colors.grey, fontWeight: FontWeight.w600)),
                    const SizedBox(height: 12),
                    Row(
                      children: [
                        Expanded(flex: 3, child: _buildInfoTile("IP Address", _ipAddress, Icons.dns, isOnline)),
                        const SizedBox(width: 10),
                        Expanded(flex: 2, child: _buildInfoTile("Port", isOnline ? "$_port" : "---", Icons.numbers, isOnline)),
                      ],
                    ),
                  ],
                ),
              );
            }

            Widget _buildInfoTile(String title, String value, IconData icon, bool active) {
              return Container(
                padding: const EdgeInsets.all(12),
                decoration: BoxDecoration(color: const Color(0xFF0F172A), borderRadius: BorderRadius.circular(10)),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(children: [
                      Icon(icon, size: 14, color: Colors.grey),
                      const SizedBox(width: 6),
                      Text(title, style: const TextStyle(fontSize: 11, color: Colors.grey)),
                    ]),
                    const SizedBox(height: 6),
                    SelectableText(value, style: TextStyle(fontSize: 13, fontWeight: FontWeight.bold, color: active ? Colors.white : Colors.grey)),
                  ],
                ),
              );
            }

            Widget _buildConsoleLogs() {
              return Container(
                padding: const EdgeInsets.all(12),
                decoration: BoxDecoration(color: const Color(0xFF050B14), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        const Text("Live Console Terminal", style: TextStyle(fontSize: 12, color: Colors.grey, fontWeight: FontWeight.bold)),
                        GestureDetector(
                          onTap: () => setState(() => _logs.clear()),
                          child: const Text("Clear Logs", style: TextStyle(fontSize: 11, color: Colors.redAccent)),
                        )
                      ],
                    ),
                    const Divider(color: Colors.white10, height: 16),
                    Expanded(
                      child: ListView.builder(
                        controller: _logScrollController,
                        itemCount: _logs.length,
                        itemBuilder: (context, index) {
                          return Padding(
                            padding: const EdgeInsets.symmetric(vertical: 2.0),
                            child: Text(_logs[index], style: const TextStyle(fontFamily: 'monospace', fontSize: 11, color: Color(0xFF34D399))),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildActionButton() {
              final bool isRunning = _serverState == ServerState.running;
              final bool isBusy = _serverState == ServerState.downloading || _serverState == ServerState.starting || _serverState == ServerState.stopping;

              return ElevatedButton(
                style: ElevatedButton.styleFrom(
                  backgroundColor: isRunning ? Colors.redAccent : const Color(0xFF10B981),
                  foregroundColor: Colors.white,
                  padding: const EdgeInsets.symmetric(vertical: 16),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                  elevation: 4,
                ),
                onPressed: isBusy ? null : (isRunning ? _stopServer : _startServer),
                child: isBusy
                    ? const SizedBox(height: 22, width: 22, child: CircularProgressIndicator(color: Colors.white, strokeWidth: 2.5))
                    : Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Icon(isRunning ? Icons.power_settings_new : Icons.play_arrow_rounded, size: 24),
                          const SizedBox(width: 8),
                          Text(
                            isRunning ? "STOP MINECRAFT SERVER" : "START MINECRAFT SERVER",
                            style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15),
                          ),
                        ],
                      ),
              );
            }
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Server-Host-v1.26
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
